name: Netlify auto-deploy

on:
  push:
    branches: [main]

concurrency:
  group: netlify-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx netlify-cli deploy --prod --build --filter hermes-command-center-web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 1c886046-83d8-4966-806f-ef3cbe86d8ef
