[build]
  command = "npm run build"
  publish = "apps/eve/.next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

# The Hermes bridge must remain private; do not proxy it publicly from Netlify.
# Configure HERMES_BRIDGE_URL only in the protected server environment.
